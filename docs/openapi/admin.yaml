openapi: 3.0.3
info:
  title: adssh local admin API
  version: "0.0.0"
  description: |
    Local admin HTTP API served by `adssh admin serve`. This is not a second
    public API. The default listen address is 127.0.0.1:8787. `--listen`
    accepts a loopback address or `unix:/absolute/path` only; 0.0.0.0, ::,
    an empty host, and non-loopback addresses are refused. A Unix socket is
    mode 0600 in a 0700 directory owned by the user.

    Authentication: send a key as `Authorization: Bearer <key>` or
    `X-ADSSH-API-Key: <key>`. Named keys come from the 0600 file named by
    ADSSH_ADMIN_KEYS (or `--keys-file`), one `name=key` per line. The matching
    key's name is the principal. Approve, deny, and unban require a named key
    and act as that name. The legacy key ADSSH_ADMIN_API_KEY (or `--api-key`)
    can only read and gets 403 on those routes. Every path except /healthz
    requires a key. Keys are compared by SHA-256 of both sides, then a
    constant-time compare, against every configured key. Audit events record
    key_fp (the SHA-256 fingerprint) and principal, and do not record the key
    or the request body.

    GET /v1/approvals returns public request ids. The stored token is not
    returned. A decision is written to the audit chain as FOUREYES_DECISION
    before the marker; if that write fails the request stays pending.
security:
  - bearerAuth: []
  - apiKeyHeader: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-ADSSH-API-Key
  schemas:
    Decision:
      type: object
      additionalProperties: false
      description: |
        Exactly one of request_id or token, both naming the public request id.
        An approver field is rejected with 400; the approver is the named key.
      properties:
        request_id:
          type: string
          pattern: "^[A-Za-z0-9_-]{1,128}$"
        token:
          type: string
          pattern: "^[A-Za-z0-9_-]{1,128}$"
    ApprovalPublic:
      type: object
      properties:
        request_id:
          type: string
        fingerprint:
          type: string
          description: SHA-256 of the stored token, only for a legacy file with no request id.
        command:
          type: string
        requester:
          type: string
        hostname:
          type: string
        timestamp:
          type: string
        status:
          type: string
          enum: [pending, claimed]
          description: claimed means a decision is in progress and the request is temporarily locked; a claim older than the rule TTL is swept and logged.
        rule:
          type: object
paths:
  /healthz:
    get:
      summary: Unauthenticated liveness. Not written to the admin audit event.
      security: []
      responses:
        "200":
          description: ok
  /v1/sessions:
    get:
      summary: Active sessions.
      responses:
        "200":
          description: Session list.
        "401":
          description: Missing or wrong API key.
  /v1/sessions/{id}/attach:
    get:
      summary: Attach to a live session (adsshadm snoop). Upgrades to adssh-attach/1.
      description: |
        Requires Connection: Upgrade and Upgrade: adssh-attach/1. view needs a
        named key; the legacy read-only key never attaches. rw also needs the
        admin.snoop.rw entitlement for the key name and a four-eyes approval:
        purpose=support is approved by the session owner (`4eyes approve`, or a
        matching four-eyes rule's approver); purpose=investigation is approved
        by a second named key over POST /v1/approvals/approve, never by the
        owner or the requesting key. While the approval is pending the request
        answers 428 at once; retry until approved within the rule TTL (default
        300s). An approval is single use. rw is refused for a session whose
        identity was asserted or set by device login. One rw controller per
        session; at most 8 viewers.

        After 101 the stream is frames of a 4-byte big-endian length (at most
        1 MiB), one type byte, and the payload: 0x10 Out (server to client),
        0x11 In and 0x12 Resize {"cols":N,"rows":N} (client to server, rw only;
        in view mode either ends the attach with Close view_only), 0x13 Close
        {"reason":"..."} either way. Close reasons from the server: detach,
        idle (10 minutes with no frame either way), session_ended, view_only,
        protocol, slow_client, write_failed, client_closed.

        MIRROR_ATTACH key, mode, purpose, reason, session, user, and notify are
        written to the audit chain before the 101 (503 if that fails) and
        MIRROR_DETACH after. Keystrokes are not audited; commands the session
        runs during an rw attach are audited with via=<key>. The owner sees
        "[adssh] <key> is viewing|controlling this session" unless policy
        returns notify=false for command snoop (args [purpose, mode, user],
        input.snoop) and ADSSH_SNOOP_NOTIFY_LOCK is not on. Without a policy
        answer, investigation is shown and support follows ADSSH_SNOOP_NOTIFY
        (default on).
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: user, in: query, required: true, description: Must equal the live session's user., schema: {type: string}}
        - {name: mode, in: query, required: true, schema: {type: string, enum: [view, rw]}}
        - {name: purpose, in: query, required: true, schema: {type: string, enum: [support, investigation]}}
        - {name: reason, in: query, required: true, description: 1-512 bytes, no control or bidi characters., schema: {type: string}}
        - {name: Connection, in: header, required: true, schema: {type: string, enum: [Upgrade]}}
        - {name: Upgrade, in: header, required: true, schema: {type: string, enum: [adssh-attach/1]}}
      responses:
        "101":
          description: Switching Protocols, Upgrade adssh-attach/1. The connection carries frames.
        "400":
          description: '{"error":"bad_upgrade"}, {"error":"bad_mode"}, {"error":"purpose_required"}, or {"error":"reason_required"}.'
        "401":
          description: Missing or wrong key ({"error":"unauthorized"}).
        "403":
          description: '{"error":"attach_forbidden"}: legacy key, rw without admin.snoop.rw, rw on an asserted or device-login identity, a denied approval, or a policy deny of snoop.'
        "404":
          description: '{"error":"session_not_found"}. Never the router''s {"error":"not found"}.'
        "409":
          description: '{"error":"user_mismatch"}, {"error":"controller_present"} (a second rw), {"error":"viewer_limit"} (more than 8 viewers), or {"error":"no_terminal"}.'
        "428":
          description: '{"error":"approval_required","request_id":"<id>"}. Approve that request, then retry.'
        "500":
          description: '{"error":"approval_unavailable"} when the four-eyes request cannot be written.'
        "503":
          description: '{"error":"audit_unavailable"}. Nothing was attached.'
  /v1/gateways:
    get:
      summary: Gateway listeners started by this process.
      responses:
        "200":
          description: Gateway list.
        "401":
          description: Missing or wrong API key.
  /v1/approvals:
    get:
      summary: Pending four-eyes requests by public request id. The stored token is not returned.
      responses:
        "200":
          description: Pending requests from this handler's engine.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApprovalPublic"
        "401":
          description: Missing or wrong key.
  /v1/approvals/approve:
    post:
      summary: Approve one pending request as the named key's principal. Requires a named key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Decision"
      responses:
        "200":
          description: Approved. Body is {"ok":true,"action":"approved","approver":"<key name>"}.
        "400":
          description: Invalid id, an approver field, an unknown field, self-approval, wrong approver, or already decided.
        "401":
          description: Missing or wrong key.
        "403":
          description: Legacy key, or a process that forbids decisions.
        "503":
          description: audit_unavailable. The decision was not recorded and the request stays pending.
  /v1/approvals/deny:
    post:
      summary: Deny one pending request as the named key's principal. Requires a named key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Decision"
      responses:
        "200":
          description: Denied. Body is {"ok":true,"action":"denied","approver":"<key name>"}.
        "400":
          description: Invalid id, an approver field, an unknown field, self-deny, wrong approver, or already decided.
        "401":
          description: Missing or wrong key.
        "403":
          description: Legacy key, or a process that forbids decisions.
        "503":
          description: audit_unavailable. The decision was not recorded and the request stays pending.
  /v1/explain:
    post:
      summary: Explain a command without executing it.
      responses:
        "200":
          description: Explanation, including required_role when the policy sets one.
        "400":
          description: Missing command or invalid JSON.
        "401":
          description: Missing or wrong API key.
  /v1/evidence:
    post:
      summary: Export a verified evidence bundle.
      responses:
        "200":
          description: Bundle. The digest covers chain entries. Lease metadata is attached after the digest.
        "400":
          description: Chain missing, unverified, or invalid filter.
        "401":
          description: Missing or wrong API key.
  /v1/recordings:
    get:
      summary: Regular JSONL recording files. Symlinks are skipped. A missing directory is an empty list.
      responses:
        "200":
          description: Recording list.
        "401":
          description: Missing or wrong API key.
  /v1/elevations:
    get:
      summary: Elevation history from a verified chain, plus active in-memory elevations when that chain file exists.
      responses:
        "200":
          description: Elevation list. A missing chain file is an empty list.
        "401":
          description: Missing or wrong API key.
        "503":
          description: chain_unavailable when no chain path is configured.
  /v1/leases:
    get:
      summary: Lease request metadata from a verified chain. Command text and secret values are not included.
      responses:
        "200":
          description: Lease list. A missing chain file is an empty list. An old request without delivery is reported as env.
        "401":
          description: Missing or wrong API key.
        "503":
          description: chain_unavailable when no chain path is configured.
  /v1/guard:
    get:
      summary: SSH listener jail status, effective config, and active bans.
      responses:
        "200":
          description: Status. Readable when the jail is tripped.
        "401":
          description: Missing or wrong API key.
  /v1/guard/unban:
    post:
      summary: Remove one ban. Requires a named key. Body is {"addr":"<ip or host:port>"}.
      responses:
        "200":
          description: Ban removed. Body is {"ok":true,"addr":"<canonical ip>"}.
        "400":
          description: Empty, invalid, or unknown-field body.
        "401":
          description: Missing or wrong API key.
        "403":
          description: Legacy key. Unban requires a named key.
        "404":
          description: Address is not banned.
        "500":
          description: The ban file could not be updated.
