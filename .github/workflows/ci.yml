name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build adssh
        run: go build -o adssh .
      - name: Build adssh-mcp
        run: go build -o adssh-mcp ./cmd/adssh-mcp
      - name: Core build carries no enterprise code
        run: |
          # Apache core: no *_ee*.go file and nothing under ee/ may be compiled in.
          # go list must succeed on its own, so a broken listing cannot pass silently.
          set -euo pipefail
          go list -deps -f '{{.ImportPath}} {{join .GoFiles " "}} {{join .CgoFiles " "}}' . ./cmd/adssh-mcp > core-files.txt
          test -s core-files.txt
          if grep -E '(_ee(_[A-Za-z0-9]+)*\.go|/ee(/|$| ))' core-files.txt; then
            echo "FAIL: the core build includes enterprise code (see docs/LICENSING.md)"
            exit 1
          fi
          if go list ./... | grep -E '/ee(/|$)'; then
            echo "FAIL: an ee/ package builds without the ee tag"
            exit 1
          fi
      - name: Build adssh (enterprise)
        run: go build -tags ee -o adssh-ee .
      - name: Build adssh-mcp (enterprise)
        run: go build -tags ee -o adssh-mcp-ee ./cmd/adssh-mcp
      - name: Build adsshadm (enterprise)
        run: go build -tags ee -o adsshadm ./ee/cmd/adsshadm

  vet:
    name: go vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Vet (enterprise)
        run: go vet -tags ee ./...

  test:
    name: Test (race + coverage)
    runs-on: ubuntu-latest
    env:
      # Coverage ratchet: catches regressions, not aspirations. Baseline measured
      # 2026-07-17: 9.7% on macOS, 7.4% on this Linux runner (per-OS files shift
      # the denominator). security 23%, engine 53%, parser 100%; the big
      # starlarkext/repl/sys surfaces are mostly e2e-covered, not unit-covered.
      # Raise via repo variable vars.COVERAGE_THRESHOLD as unit coverage grows.
      COVERAGE_THRESHOLD: ${{ vars.COVERAGE_THRESHOLD || '7' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tests with race detector and coverage
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error
      - name: Enforce coverage threshold
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')
          echo "Total coverage: ${total}% (threshold: ${COVERAGE_THRESHOLD}%)"
          awk -v t="$total" -v gate="$COVERAGE_THRESHOLD" \
            'BEGIN { if (t + 0 < gate + 0) { print "FAIL: coverage " t "% is below the " gate "% ratchet"; exit 1 } }'
      - name: Run enterprise tests with race detector
        run: go test -race -tags ee . ./security/ ./cmd/adssh-mcp/ ./engine/ ./internal/grid/ ./internal/sah/ ./ee/...

  e2e:
    name: E2E (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run end-to-end suite
        run: make test-e2e
      - name: Run root-only SSH end-to-end test
        if: runner.os == 'Linux'
        run: sudo -E env "PATH=$PATH" go test -tags e2e -count=1 -run '^TestSSHRoundTrip$' ./e2e/...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m
      - name: golangci-lint (enterprise)
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m --build-tags=ee,e2e
