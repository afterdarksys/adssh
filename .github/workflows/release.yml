name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version to package, e.g. v0.9.0
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build release artifacts
    runs-on: ubuntu-latest
    outputs:
      base64-subjects: ${{ steps.subjects.outputs.value }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Import release signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          fi

      - name: Package
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          GO_BIN: go
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            export GPG_SIGN=1
          fi
          scripts/package-release.sh

      - name: Hash subjects for SLSA
        id: subjects
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -eu
          if [ ! -d dist ] || [ -z "$(ls -A dist)" ]; then
            echo "value=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          value=$(sha256sum dist/* | base64 -w0)
          echo "value=${value}" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: adssh-release-${{ github.event.inputs.version || github.ref_name }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

  provenance:
    name: SLSA generic provenance
    needs: release
    if: startsWith(github.ref, 'refs/tags/') && needs.release.outputs.base64-subjects != ''
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.release.outputs.base64-subjects }}
      upload-assets: true
